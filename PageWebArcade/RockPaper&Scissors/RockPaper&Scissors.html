<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="RockPaper&Scissors.css">
</head>

<body>
<audio autoplay loop>
    <source src="04 The Rumble of Scientific Triumph.flac" type="audio/flac">
</audio>
    <div class="choices">
        <h1>Rock - Paper - Scissors</h1>
        <button onclick="playGame('rock')">👊</button>
        <button onclick="playGame('paper')">🤚</button>
        <button onclick="playGame('scissors')">✌️</button>
    </div>

    <div id="playerDisplay">PLAYER</div>
    <div id="computerDisplay">COMPUTER</div>
    <div id="resultDisplay"></div>

    <div class="Score"> PLAYER SCORE:
        <span id="playerScore">0</span>
    </div>
    <div class="Score"> COMPUTER SCORE:
        <span id="computerScore">0</span>
    </div>
    <br>
    <p class="instructions">
    Usa el mouse / teclado para jugar. Presiona RESTART para reiniciar.
</p>
<button id="restartBtn">RESTART</button>
  <a href="../Arcade.html" class="arcade-btn">⬅ Volver al Arcade</a>
    <script src="RockPaper&Scissors.js"></script>


</body>

</html>
